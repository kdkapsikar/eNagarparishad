name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enagar
          POSTGRES_PASSWORD: enagar
          POSTGRES_DB: enagar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enagar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://enagar:enagar@localhost:5432/enagar_test
      TEST_DATABASE_URL: postgres://enagar:enagar@localhost:5432/enagar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
