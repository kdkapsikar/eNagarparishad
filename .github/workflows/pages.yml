name: Deploy web app to GitHub Pages

# Publishes the React app only. The API + database must be hosted elsewhere (see README, "Deploying").
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
# - Without the API_URL variable, a DEMO build is published: the app runs entirely in the visitor's browser
#   with sample data (client/src/api/demoServer.js), so it can be tried before a server exists.
# - Add Settings -> Secrets and variables -> Actions -> Variables -> API_URL (your deployed API's URL) and
#   re-run this workflow to publish the real app.

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: ${{ vars.API_URL }}
      VITE_DEMO: ${{ vars.API_URL == '' && 'true' || 'false' }}
      VITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - name: Build mode
        run: echo "::notice::Publishing a ${{ vars.API_URL == '' && 'DEMO build (no API_URL set)' || 'build for the API at ' }}${{ vars.API_URL }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build -w client

      # GitHub Pages serves 404.html for unknown paths; making it a copy of index.html lets deep links
      # such as /eNagarparishad/schemes/3 load the React app, which then routes client-side.
      - name: SPA fallback for deep links
        run: cp client/dist/index.html client/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
